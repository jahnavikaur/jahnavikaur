<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4f1"/>
      <stop offset="0.55" stop-color="#ead9ff"/>
      <stop offset="1" stop-color="#d6ebff"/>
    </linearGradient>
    <clipPath id="round"><rect width="800" height="200" rx="24"/></clipPath>
    <path id="heart" d="M0,6 C-12,-4 -8,-12 0,-6 C8,-12 12,-4 0,6 Z"/>
    <path id="spark" d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z"/>
    <style>
      .b { fill:#ffffff; stroke:#f0b8d4; stroke-width:1.5; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="800" height="200" fill="url(#sky)"/>

    <!-- drifting clouds -->
    <g transform="translate(120,40)">
      <g fill="#fff" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0 0; 50 0; 0 0" dur="12s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="34" ry="11"/>
        <ellipse cx="-14" cy="-8" rx="16" ry="11"/>
        <ellipse cx="10" cy="-11" rx="20" ry="13"/>
      </g>
    </g>
    <g transform="translate(620,55)">
      <g fill="#fff" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 0; 0 0" dur="16s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="30" ry="10"/>
        <ellipse cx="-12" cy="-7" rx="14" ry="10"/>
        <ellipse cx="9" cy="-10" rx="18" ry="12"/>
      </g>
    </g>

    <!-- centre text -->
    <text x="400" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#b5679a">made with love, code &amp; a little magic</text>
    <text x="400" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c084fc" letter-spacing="3">✦  thanks for visiting  ✦</text>

    <!-- twinkling sparkles -->
    <g transform="translate(70,60)"><use href="#spark" fill="#fff"><animateTransform attributeName="transform" type="scale" values="0.3;1.2;0.3" dur="2.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(250,30)"><use href="#spark" fill="#f9a8d4"><animateTransform attributeName="transform" type="scale" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></use></g>
    <g transform="translate(540,35)"><use href="#spark" fill="#fff"><animateTransform attributeName="transform" type="scale" values="0.3;1.3;0.3" dur="2.8s" repeatCount="indefinite"/></use></g>
    <g transform="translate(740,90)"><use href="#spark" fill="#c084fc"><animateTransform attributeName="transform" type="scale" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(330,150)"><use href="#spark" fill="#fff"><animateTransform attributeName="transform" type="scale" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></use></g>

    <!-- floating hearts -->
    <use href="#heart" x="160" y="190" fill="#ffafcc">
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 -170" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </use>
    <use href="#heart" x="330" y="190" fill="#e0bbff">
      <animateTransform attributeName="transform" type="translate" values="0 0; -16 -170" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </use>
    <use href="#heart" x="480" y="190" fill="#f9a8d4">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 -170" dur="6.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="0.8s" repeatCount="indefinite"/>
    </use>
    <use href="#heart" x="650" y="190" fill="#bde0fe">
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 -170" dur="7.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="2.5s" repeatCount="indefinite"/>
    </use>

    <!-- rolling hills -->
    <path d="M0 172 Q100 150 200 172 T400 172 T600 172 T800 172 V200 H0 Z" fill="#fbcfe8"/>
    <path d="M0 184 Q100 166 200 184 T400 184 T600 184 T800 184 V200 H0 Z" fill="#f9a8d4" opacity="0.7"/>

    <!-- little flowers -->
    <g fill="#fff"><circle cx="60" cy="182" r="3"/><circle cx="210" cy="188" r="3"/><circle cx="430" cy="183" r="3"/><circle cx="590" cy="188" r="3"/><circle cx="730" cy="182" r="3"/></g>
    <g fill="#fde68a"><circle cx="60" cy="182" r="1.2"/><circle cx="210" cy="188" r="1.2"/><circle cx="430" cy="183" r="1.2"/><circle cx="590" cy="188" r="1.2"/><circle cx="730" cy="182" r="1.2"/></g>

    <!-- hopping bunny -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-80 0; 880 0" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(0,150)">
        <ellipse cx="2" cy="19" rx="20" ry="3.5" fill="#d946ef" opacity="0.18"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -24; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.2 0.6 0.4 1; 0.6 0 0.8 0.4" dur="0.7s" repeatCount="indefinite"/>
          <!-- ears -->
          <ellipse class="b" cx="14" cy="-34" rx="4.5" ry="12" transform="rotate(-10 14 -34)"/>
          <ellipse cx="14" cy="-34" rx="2" ry="8" fill="#ffc8dd" transform="rotate(-10 14 -34)"/>
          <ellipse class="b" cx="25" cy="-33" rx="4.5" ry="12" transform="rotate(12 25 -33)"/>
          <ellipse cx="25" cy="-33" rx="2" ry="8" fill="#ffc8dd" transform="rotate(12 25 -33)"/>
          <!-- tail, body, feet, head -->
          <circle class="b" cx="-23" cy="2" r="6"/>
          <ellipse class="b" cx="0" cy="0" rx="22" ry="16"/>
          <ellipse class="b" cx="10" cy="15" rx="8" ry="4"/>
          <ellipse class="b" cx="-10" cy="15" rx="8" ry="4"/>
          <circle class="b" cx="18" cy="-14" r="12"/>
          <!-- face -->
          <circle cx="23" cy="-16" r="1.8" fill="#6b3a5b"/>
          <circle cx="24" cy="-10" r="3" fill="#ffafcc" opacity="0.7"/>
          <ellipse cx="29" cy="-12" rx="1.6" ry="1.2" fill="#f472b6"/>
          <!-- bow -->
          <path d="M20 -26 L13 -30 L13 -22 Z M20 -26 L27 -30 L27 -22 Z" fill="#f472b6"/>
          <circle cx="20" cy="-26" r="2" fill="#ec4899"/>
        </g>
      </g>
    </g>
  </g>
</svg>
